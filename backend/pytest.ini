[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    needs_ollama: marks test requiring a live Ollama daemon
    needs_network: marks test requiring external network connectivity
    needs_gpu: marks test requiring a dedicated GPU (CUDA/ROCm)
    needs_docker: marks test requiring a live Docker daemon
    slow: marks long-running test (> 5s)

